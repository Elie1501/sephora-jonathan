<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>RSVP - Sephora & Jonathan</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* =========================================
           FOND
        ========================================= */

        .bg-container {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: url('fond1.png') no-repeat center center;
            background-size: cover;

            z-index: 1;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.02);

            z-index: 2;
        }

        /* =========================================
           CONTENU
        ========================================= */

        .main-ui {
            position: relative;
            z-index: 10;

            width: 100%;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 20px;

            text-align: center;
        }

        /* =========================================
           CARTE
        ========================================= */

        .overlay-card {

            width: min(460px, 100%);

            padding: 34px 28px 27px;

            background: rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            border: 1px solid rgba(255, 255, 255, 0.30);

            box-shadow:
                    0 10px 35px rgba(198, 106, 74, 0.10);

            text-align: center;

            animation: fadeIn 1.2s ease-out;
        }

        /* =========================================
           EN-TÊTE
        ========================================= */

        .top-label {

            font-family: 'Montserrat', sans-serif;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 3px;

            line-height: 1.6;

            color: #C66A4A;

            font-weight: 800;

            margin-bottom: 14px;

            text-shadow:
                    0 0 8px rgba(255,255,255,1),
                    0 0 15px rgba(255,255,255,.85);
        }

        /* =========================================
           TITRE
        ========================================= */

        .script-title {

            font-family: 'Great Vibes', cursive;

            font-size: clamp(4rem, 15vw, 5rem);

            font-weight: 400;

            line-height: .95;

            color: #C66A4A;

            margin-bottom: 8px;

            text-shadow:
                    0 0 10px rgba(255,255,255,.95),
                    0 0 25px rgba(255,255,255,.8),
                    0 0 45px rgba(255,255,255,.5);
        }

        /* =========================================
           DÉCORATION
        ========================================= */

        .title-decoration {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 13px;
        }

        .title-decoration::before,
        .title-decoration::after {

            content: "";

            width: 42px;

            height: 1px;

            background: #C66A4A;

            opacity: .6;
        }

        .title-decoration span {

            color: #C66A4A;

            font-size: 13px;

            opacity: .9;

            text-shadow:
                    0 0 8px rgba(255,255,255,1),
                    0 0 15px rgba(255,255,255,.8);
        }

        /* =========================================
           INSTRUCTION
        ========================================= */

        .instruction {

            font-family: 'Montserrat', sans-serif;

            font-size: 10px;

            line-height: 1.6;

            color: #6F3828;

            font-style: italic;

            font-weight: 600;

            margin-bottom: 9px;

            text-shadow:
                    0 0 7px rgba(255,255,255,.9);
        }

        /* =========================================
           DATE LIMITE
        ========================================= */

        .deadline {

            font-family: 'Montserrat', sans-serif;

            font-size: 10px;

            line-height: 1.5;

            color: #C66A4A;

            font-weight: 700;

            letter-spacing: .8px;

            margin-top: 0;

            margin-bottom: 18px;

            text-shadow:
                    0 0 7px rgba(255,255,255,.95),
                    0 0 12px rgba(255,255,255,.75);
        }

        /* =========================================
           FORMULAIRE
        ========================================= */

        .rsvp-form {
            text-align: left;
        }

        /* =========================================
           LABELS
        ========================================= */

        .rsvp-form > label:not(.option-item) {

            display: block;

            font-family: 'Cinzel', serif;

            font-size: 10px;

            color: #C66A4A;

            margin-top: 15px;
            margin-bottom: 7px;

            letter-spacing: 1.1px;

            font-weight: 800;

            line-height: 1.5;

            text-shadow:
                    0 0 6px rgba(255,255,255,.9);
        }

        /* =========================================
           INPUTS
        ========================================= */

        input[type="text"],
        input[type="number"] {

            width: 100%;

            padding: 11px 10px;

            border: none;

            border-bottom:
                    1px solid rgba(198,106,74,.55);

            outline: none;

            background: rgba(255,255,255,.18);

            color: #1a1a1a;

            font-family: 'Montserrat', sans-serif;

            font-size: 14px;

            font-weight: 500;

            border-radius: 3px 3px 0 0;

            transition: .25s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {

            border-bottom-color: #C66A4A;

            background: rgba(255,255,255,.30);

            box-shadow:
                    0 4px 10px rgba(198,106,74,.08);
        }

        input::placeholder {

            color: #555;

            opacity: .65;
        }

        /* =========================================
           OPTIONS
        ========================================= */

        .presence-options {

            display: flex;

            align-items: center;

            gap: 25px;

            margin-top: 4px;
        }

        .option-item {

            display: flex;

            align-items: center;

            gap: 7px;

            cursor: pointer;

            font-family: 'Montserrat', sans-serif;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: #6F3828;

            font-weight: 700;

            margin: 0;

            line-height: 1.4;

            text-shadow:
                    0 0 6px rgba(255,255,255,.8);
        }

        /* =========================================
           RADIO
        ========================================= */

        input[type="radio"] {

            appearance: none;
            -webkit-appearance: none;

            width: 16px;
            height: 16px;

            flex-shrink: 0;

            border:
                    1.5px solid #C66A4A;

            border-radius: 50%;

            background:
                    rgba(255,255,255,.20);

            position: relative;

            cursor: pointer;
        }

        input[type="radio"]:checked {

            box-shadow:
                    0 0 8px rgba(198,106,74,.25);
        }

        input[type="radio"]:checked::after {

            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #C66A4A;

            top: 2.5px;
            left: 2.5px;
        }

        /* =========================================
           NOMBRE DE PERSONNES
        ========================================= */

        .guest-count-box {

            display: none;

            margin-top: 8px;

            animation: slideDown .3s ease;
        }

        .guest-count-box input {

            font-size: 13px;
        }

        /* =========================================
           SÉPARATEUR
        ========================================= */

        .form-divider {

            width: 55px;

            height: 1px;

            background: #C66A4A;

            opacity: .55;

            margin: 19px auto 5px;
        }

        /* =========================================
           BOUTON
        ========================================= */

        .btn-submit {

            width: 100%;

            margin-top: 22px;

            padding: 13px 12px;

            border: none;

            background: #C66A4A;

            color: #fff;

            font-family: 'Montserrat', sans-serif;

            text-transform: uppercase;

            letter-spacing: 2.5px;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                    0 5px 18px rgba(198,106,74,.3);

            transition:
                    transform .3s ease,
                    background .3s ease,
                    box-shadow .3s ease;
        }

        .btn-submit:hover {

            background: #B85D40;

            transform: translateY(-2px);

            box-shadow:
                    0 8px 25px rgba(198,106,74,.4);
        }

        .btn-submit:active {

            transform: translateY(-1px);
        }

        .btn-submit:disabled {

            opacity: .7;

            cursor: wait;

            transform: none;
        }

        /* =========================================
           RETOUR
        ========================================= */

        .back-btn {

            display: inline-block;

            margin-top: 16px;

            text-decoration: none;

            color: #C66A4A;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 2.5px;

            font-weight: 700;

            opacity: .85;

            border-bottom:
                    1px solid rgba(198,106,74,.55);

            padding-bottom: 3px;

            transition: .25s ease;

            text-shadow:
                    0 0 7px rgba(255,255,255,.9);
        }

        .back-btn:hover {

            opacity: 1;

            color: #B85D40;
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .main-ui {

                min-height: 100dvh;

                padding: 14px 10px;

                justify-content: center;
            }

            .overlay-card {

                width: 100%;

                max-width: 430px;

                padding: 28px 19px 24px;

                border-radius: 18px;
            }

            /* EN-TÊTE */

            .top-label {

                font-size: 10px;

                font-weight: 800;

                letter-spacing: 2px;

                margin-bottom: 12px;
            }

            /* TITRE */

            .script-title {

                font-size: 4.15rem;

                margin-bottom: 7px;
            }

            .title-decoration {

                margin-bottom: 12px;
            }

            .title-decoration::before,
            .title-decoration::after {

                width: 35px;

                height: 2px;
            }

            .title-decoration span {

                font-size: 14px;
            }

            /* INSTRUCTION */

            .instruction {

                font-size: 10px;

                font-weight: 700;

                line-height: 1.6;

                margin-bottom: 7px;
            }

            /* DATE LIMITE */

            .deadline {

                font-size: 10px;

                font-weight: 800;

                letter-spacing: .5px;

                line-height: 1.6;

                margin-top: 0;

                margin-bottom: 15px;
            }

            /* LABELS */

            .rsvp-form > label:not(.option-item) {

                font-size: 11px;

                font-weight: 800;

                letter-spacing: .9px;

                margin-top: 13px;

                margin-bottom: 7px;
            }

            /* INPUTS */

            input[type="text"],
            input[type="number"] {

                padding: 12px 10px;

                font-size: 14px;

                font-weight: 600;
            }

            /* OPTIONS */

            .presence-options {

                gap: 24px;

                margin-top: 5px;
            }

            .option-item {

                font-size: 10px;

                font-weight: 800;

                gap: 7px;
            }

            input[type="radio"] {

                width: 17px;

                height: 17px;
            }

            input[type="radio"]:checked::after {

                width: 9px;

                height: 9px;

                top: 3px;

                left: 3px;
            }

            /* NOMBRE */

            .guest-count-box {

                margin-top: 8px;
            }

            .guest-count-box input {

                font-size: 13px;

                font-weight: 600;
            }

            /* SÉPARATEUR */

            .form-divider {

                width: 55px;

                height: 2px;

                margin: 16px auto 4px;
            }

            /* BOUTON */

            .btn-submit {

                margin-top: 19px;

                padding: 14px 10px;

                font-size: 9px;

                font-weight: 800;

                letter-spacing: 2.2px;
            }

            /* RETOUR */

            .back-btn {

                margin-top: 15px;

                font-size: 9px;

                font-weight: 800;

                letter-spacing: 2.2px;
            }
        }

        /* =========================================
           TRÈS PETITS TÉLÉPHONES
        ========================================= */

        @media (max-width: 380px) {

            .main-ui {

                padding: 10px 7px;
            }

            .overlay-card {

                padding: 23px 15px 20px;
            }

            .top-label {

                font-size: 9px;

                letter-spacing: 1.5px;
            }

            .script-title {

                font-size: 3.7rem;
            }

            .instruction {

                font-size: 9.5px;
            }

            .deadline {

                font-size: 9px;

                font-weight: 800;

                letter-spacing: .3px;

                margin-bottom: 13px;
            }

            .rsvp-form > label:not(.option-item) {

                font-size: 10px;

                margin-top: 11px;
            }

            input[type="text"],
            input[type="number"] {

                font-size: 13px;

                padding: 11px 9px;
            }

            .option-item {

                font-size: 9.5px;
            }

            .btn-submit {

                font-size: 8px;

                letter-spacing: 1.8px;
            }

            .back-btn {

                font-size: 8px;
            }
        }

        /* =========================================
           PETITS ÉCRANS EN HAUTEUR
        ========================================= */

        @media (max-height: 700px) and (max-width: 600px) {

            .main-ui {

                justify-content: flex-start;

                padding-top: 10px;

                padding-bottom: 10px;
            }

            .overlay-card {

                padding-top: 20px;

                padding-bottom: 18px;
            }

            .top-label {

                margin-bottom: 7px;
            }

            .script-title {

                font-size: 3.5rem;
            }

            .title-decoration {

                margin-bottom: 8px;
            }

            .instruction {

                margin-bottom: 5px;
            }

            .deadline {

                margin-bottom: 9px;

                font-size: 9px;
            }

            .rsvp-form > label:not(.option-item) {

                margin-top: 8px;

                margin-bottom: 5px;
            }

            input[type="text"],
            input[type="number"] {

                padding: 9px;
            }

            .form-divider {

                margin-top: 12px;
            }

            .btn-submit {

                margin-top: 14px;
            }

            .back-btn {

                margin-top: 10px;
            }
        }

    </style>

</head>

<body>

<div class="bg-container"></div>

<div class="bg-overlay"></div>


<main class="main-ui">

    <div class="overlay-card">

        <!-- EN-TÊTE -->

        <div class="top-label">
            Sephora & Jonathan
        </div>


        <!-- TITRE -->

        <h1 class="script-title">
            Réponse
        </h1>


        <!-- DÉCORATION -->

        <div class="title-decoration">
            <span>♡</span>
        </div>


        <!-- MESSAGE -->

        <p class="instruction">
            Merci de confirmer votre présence
        </p>


        <!-- DATE LIMITE -->

        <p class="deadline">
            Votre réponse est attendue avant le 16/11/2026
        </p>


        <!-- FORMULAIRE -->

        <form
                id="rsvpForm"
                class="rsvp-form"
        >

            <input
                    type="hidden"
                    name="Chabbat_present"
                    value="Non"
            >

            <input
                    type="hidden"
                    name="Chabbat_nombre"
                    value="0"
            >


            <!-- NOM -->

            <label>
                Nom & Prénom
            </label>

            <input
                    type="text"
                    name="Nom"
                    required
                    placeholder="Ex : Famille Cohen"
            >


            <!-- MAIRIE -->

            <label>
                Mairie — 7 décembre 2026
            </label>


            <div class="presence-options">

                <label class="option-item">

                    <input
                            type="radio"
                            name="Mairie_present"
                            value="Present"
                            onclick="showCount('mairie', true)"
                            required
                    >

                    Présent

                </label>


                <label class="option-item">

                    <input
                            type="radio"
                            name="Mairie_present"
                            value="Non"
                            onclick="showCount('mairie', false)"
                    >

                    Non

                </label>

            </div>


            <div
                    id="count_mairie"
                    class="guest-count-box"
            >

                <input
                        type="number"
                        name="Mairie_nombre"
                        placeholder="Nombre de personnes"
                        min="1"
                >

            </div>


            <!-- HOUPPA -->

            <label>
                Houppa & Soirée — 8 décembre 2026
            </label>


            <div class="presence-options">

                <label class="option-item">

                    <input
                            type="radio"
                            name="Houppa_present"
                            value="Present"
                            onclick="showCount('houppa', true)"
                            required
                    >

                    Présent

                </label>


                <label class="option-item">

                    <input
                            type="radio"
                            name="Houppa_present"
                            value="Non"
                            onclick="showCount('houppa', false)"
                    >

                    Non

                </label>

            </div>


            <div
                    id="count_houppa"
                    class="guest-count-box"
            >

                <input
                        type="number"
                        name="Houppa_nombre"
                        placeholder="Nombre de personnes"
                        min="1"
                >

            </div>


            <div class="form-divider"></div>


            <!-- BOUTON -->

            <button
                    type="submit"
                    class="btn-submit"
                    id="submitBtn"
            >
                Confirmer ma venue
            </button>

        </form>


        <!-- RETOUR -->

        <a
                href="menu.html"
                class="back-btn"
        >
            Retour
        </a>

    </div>

</main>


<script>

    /* =========================================
       AFFICHAGE NOMBRE INVITÉS
    ========================================= */

    function showCount(event, isPresent) {

        const box =
            document.getElementById(
                'count_' + event
            );

        const input =
            box.querySelector('input');


        box.style.display =
            isPresent
                ? 'block'
                : 'none';


        if (!isPresent) {

            input.value = "";

            input.required = false;

        } else {

            input.required = true;

        }
    }


    /* =========================================
       GOOGLE APPS SCRIPT
    ========================================= */

    const scriptURL =
        'https://script.google.com/macros/s/AKfycbxRJvIxCqOPLGQ3IKx7YEEGptfV872PrGsRdNbqHJqQUHWMJnn4sEFjoks-qmXlCGNLPw/exec';


    const form =
        document.getElementById('rsvpForm');


    form.addEventListener(
        'submit',
        e => {

            e.preventDefault();


            const btn =
                document.getElementById(
                    'submitBtn'
                );


            btn.innerHTML =
                "Envoi...";

            btn.disabled = true;


            fetch(
                scriptURL,
                {
                    method: 'POST',
                    body: new FormData(form)
                }
            )
                .then(() => {

                    btn.innerHTML =
                        "Merci !";


                    form.reset();


                    document.getElementById(
                        'count_mairie'
                    ).style.display = 'none';


                    document.getElementById(
                        'count_houppa'
                    ).style.display = 'none';


                    setTimeout(() => {

                        window.location.href =
                            "premiere-page.html";

                    }, 2000);

                })
                .catch(() => {

                    alert(
                        "Une erreur est survenue lors de l'envoi."
                    );


                    btn.disabled = false;


                    btn.innerHTML =
                        "Confirmer ma venue";

                });

        }
    );

</script>

</body>
</html>
