<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Réponse — Sephora & Jonathan</title>

    <!-- POLICES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap"
            rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            color: #1a1a1a;
        }

        /* =========================================
           FOND
        ========================================= */

        .bg-container {
            position: fixed;
            inset: 0;
            z-index: -3;

            background-image: url("fond1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;

            background: rgba(255,255,255,.02);
        }

        /* =========================================
           CONTENU PRINCIPAL
        ========================================= */

        .main-ui {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 15px;
        }

        /* =========================================
           CARTE
        ========================================= */

        .overlay-card {
            width: min(460px, 100%);

            padding: 34px 30px 30px;

            background: rgba(255,255,255,.65);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            border: 1px solid rgba(255,255,255,.75);

            box-shadow:
                    0 15px 40px rgba(198,106,74,.15);

            border-radius: 4px;

            text-align: center;
        }

        /* =========================================
           TITRES
        ========================================= */

        .top-label {
            font-family: 'Cinzel', serif;

            font-size: 10px;
            letter-spacing: 3px;

            color: #C66A4A;

            margin-bottom: 7px;

            text-transform: uppercase;
        }

        .script-title {
            font-family: 'Great Vibes', cursive;

            font-size: 48px;
            font-weight: 400;

            color: #C66A4A;

            line-height: 1;

            text-shadow:
                    0 1px 4px rgba(255,255,255,.8);

            margin-bottom: 8px;
        }

        .title-decoration {
            width: 45px;
            height: 1px;

            margin: 0 auto 18px;

            background: #C66A4A;

            opacity: .65;
        }

        .instruction {
            font-family: 'Cinzel', serif;

            font-size: 11px;
            letter-spacing: 1px;

            margin-bottom: 7px;

            color: #333;
        }

        .deadline {
            font-size: 9px;
            letter-spacing: .8px;

            color: #555;

            margin-bottom: 25px;
        }

        /* =========================================
           FORMULAIRE
        ========================================= */

        .rsvp-form {
            width: 100%;

            text-align: left;
        }

        .rsvp-form label {
            display: block;

            font-family: 'Cinzel', serif;

            font-size: 10px;
            letter-spacing: .7px;

            color: #333;

            margin-bottom: 7px;
        }

        /* =========================================
           INPUTS
        ========================================= */

        .rsvp-form input[type="text"],
        .rsvp-form input[type="number"] {

            width: 100%;

            padding: 10px 9px;

            border: none;
            border-bottom: 1px solid rgba(198,106,74,.55);

            outline: none;

            background: rgba(255,255,255,.25);

            color: #1a1a1a;

            font-family: 'Montserrat', sans-serif;

            font-size: 12px;

            margin-bottom: 18px;

            transition: .25s ease;
        }

        .rsvp-form input[type="text"]:focus,
        .rsvp-form input[type="number"]:focus {

            border-bottom-color: #C66A4A;

            background: rgba(255,255,255,.45);

            box-shadow:
                    0 4px 10px rgba(198,106,74,.08);
        }

        .rsvp-form input::placeholder {
            color: #555;
            opacity: .65;
        }

        /* =========================================
           MOT POUR LES MARIÉS
        ========================================= */

        .message-group {
            margin-bottom: 20px;
        }

        .message-group label {
            margin-bottom: 8px;
        }

        .message-box {

            width: 100%;

            min-height: 100px;

            padding: 12px;

            border: 1px solid rgba(198,106,74,.45);

            border-radius: 8px;

            outline: none;

            resize: vertical;

            background: rgba(255,255,255,.35);

            color: #1a1a1a;

            font-family: 'Montserrat', sans-serif;

            font-size: 12px;

            font-weight: 500;

            line-height: 1.5;

            transition: .25s ease;
        }

        .message-box:focus {

            border-color: #C66A4A;

            background: rgba(255,255,255,.55);

            box-shadow:
                    0 4px 10px rgba(198,106,74,.08);
        }

        .message-box::placeholder {

            color: #555;

            opacity: .65;
        }

        /* =========================================
           RADIO
        ========================================= */

        .radio-group {

            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 10px;
        }

        .radio-option {

            display: flex !important;

            align-items: center;

            gap: 6px;

            margin: 0 !important;

            font-family: 'Montserrat', sans-serif !important;

            font-size: 11px !important;

            letter-spacing: 0 !important;

            cursor: pointer;
        }

        .radio-option input {

            appearance: none;
            -webkit-appearance: none;

            width: 15px;
            height: 15px;

            border: 1px solid #C66A4A;

            border-radius: 50%;

            background: rgba(255,255,255,.4);

            cursor: pointer;

            position: relative;
        }

        .radio-option input:checked::after {

            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            top: 3px;
            left: 3px;

            border-radius: 50%;

            background: #C66A4A;
        }

        /* =========================================
           NOMBRE D'INVITÉS
        ========================================= */

        .guest-count-box {

            display: none;

            margin: 5px 0 18px;

            padding: 10px;

            background: rgba(255,255,255,.25);

            border-left: 2px solid #C66A4A;
        }

        .guest-count-box label {

            font-family: 'Montserrat', sans-serif;

            font-size: 9px;

            letter-spacing: .3px;

            margin-bottom: 5px;
        }

        .guest-count-box input {

            margin-bottom: 0 !important;
        }

        /* =========================================
           SÉPARATEUR
        ========================================= */

        .form-divider {

            width: 100%;

            height: 1px;

            background: rgba(198,106,74,.25);

            margin: 8px 0 20px;
        }

        /* =========================================
           BOUTON
        ========================================= */

        .btn-submit {

            width: 100%;

            padding: 13px 15px;

            border: none;

            background: #C66A4A;

            color: white;

            font-family: 'Cinzel', serif;

            font-size: 10px;

            letter-spacing: 1.5px;

            cursor: pointer;

            border-radius: 2px;

            transition: .25s ease;

            box-shadow:
                    0 5px 15px rgba(198,106,74,.18);
        }

        .btn-submit:hover {

            background: #B85D40;

            transform: translateY(-1px);
        }

        .btn-submit:disabled {

            opacity: .7;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================================
           RETOUR
        ========================================= */

        .back-btn {

            display: block;

            margin-top: 17px;

            text-align: center;

            color: #555;

            text-decoration: none;

            font-family: 'Cinzel', serif;

            font-size: 9px;

            letter-spacing: 1px;

            transition: .2s ease;
        }

        .back-btn:hover {
            color: #C66A4A;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .main-ui {
                align-items: flex-start;

                padding: 20px 12px;
            }

            .overlay-card {

                width: 100%;

                padding: 28px 20px 25px;

                background: rgba(255,255,255,.65);

                border: 1px solid rgba(255,255,255,.75);
            }

            .top-label {

                font-size: 10px;

                font-weight: 600;

                letter-spacing: 2.5px;
            }

            .script-title {

                font-size: 44px;
            }

            .instruction {

                font-size: 11px;

                font-weight: 600;

                line-height: 1.5;
            }

            .deadline {

                font-size: 9px;

                font-weight: 600;

                line-height: 1.5;

                margin-bottom: 23px;
            }

            .rsvp-form label {

                font-size: 10px;

                font-weight: 700;
            }

            .rsvp-form input[type="text"],
            .rsvp-form input[type="number"] {

                font-size: 13px;

                font-weight: 600;

                padding: 11px 9px;
            }

            .message-box {

                min-height: 105px;

                padding: 12px 10px;

                font-size: 13px;

                font-weight: 600;
            }

            .radio-option {

                font-size: 12px !important;

                font-weight: 600;
            }

            .btn-submit {

                font-size: 10px;

                font-weight: 600;

                padding: 14px;
            }

            .back-btn {

                font-size: 9px;

                font-weight: 600;
            }
        }

        /* =========================================
           PETITS ÉCRANS
        ========================================= */

        @media (max-width: 380px) {

            .overlay-card {

                padding: 25px 17px 22px;
            }

            .script-title {

                font-size: 40px;
            }

            .radio-group {

                gap: 12px;
            }

            .radio-option {

                font-size: 11px !important;
            }
        }

        @media (max-height: 700px) {

            .main-ui {

                align-items: flex-start;
            }
        }

    </style>
</head>

<body>

<!-- =========================================
     FOND
========================================= -->

<div class="bg-container"></div>
<div class="bg-overlay"></div>


<!-- =========================================
     CONTENU
========================================= -->

<main class="main-ui">

    <section class="overlay-card">

        <div class="top-label">
            Sephora & Jonathan
        </div>

        <h1 class="script-title">
            Réponse
        </h1>

        <div class="title-decoration"></div>

        <p class="instruction">
            Merci de confirmer votre présence
        </p>

        <p class="deadline">
            Votre réponse est attendue avant le 16/11/2026
        </p>


        <!-- =====================================
             FORMULAIRE
        ====================================== -->

        <form
                class="rsvp-form"
                id="rsvpForm"
        >

            <!-- VALEURS PAR DÉFAUT CHABBAT -->

            <input
                    type="hidden"
                    name="Chabbat_present"
                    value="Non"
            >

            <input
                    type="hidden"
                    name="Chabbat_nombre"
                    value="0"
            >


            <!-- NOM -->

            <label for="nom">
                Nom & Prénom
            </label>

            <input
                    type="text"
                    id="nom"
                    name="Nom"
                    required
                    placeholder="Ex : Famille Cohen"
            >


            <!-- =================================
                 MOT POUR LES MARIÉS
            ================================== -->

            <div class="message-group">

                <label for="message">
                    Un mot pour les mariés
                </label>

                <textarea
                        id="message"
                        name="Mot_pour_les_maries"
                        class="message-box"
                        placeholder="Écrivez-nous un petit mot..."
                        rows="4"
                ></textarea>

            </div>


            <!-- =================================
                 MAIRIE
            ================================== -->

            <label>
                Mairie — 7 décembre 2026
            </label>

            <div class="radio-group">

                <label class="radio-option">

                    <input
                            type="radio"
                            name="Mairie_present"
                            value="Oui"
                            onchange="showCount(event, true)"
                            required
                    >

                    Oui

                </label>


                <label class="radio-option">

                    <input
                            type="radio"
                            name="Mairie_present"
                            value="Non"
                            onchange="showCount(event, false)"
                    >

                    Non

                </label>

            </div>


            <div
                    class="guest-count-box"
                    id="Mairie_count_box"
            >

                <label for="Mairie_nombre">
                    Nombre de personnes
                </label>

                <input
                        type="number"
                        id="Mairie_nombre"
                        name="Mairie_nombre"
                        min="1"
                        max="20"
                        value="1"
                >

            </div>


            <!-- =================================
                 SÉPARATEUR
            ================================== -->

            <div class="form-divider"></div>


            <!-- =================================
                 HOUPPA
            ================================== -->

            <label>
                Houppa & Soirée — 8 décembre 2026
            </label>

            <div class="radio-group">

                <label class="radio-option">

                    <input
                            type="radio"
                            name="Houppa_present"
                            value="Oui"
                            onchange="showCount(event, true)"
                            required
                    >

                    Oui

                </label>


                <label class="radio-option">

                    <input
                            type="radio"
                            name="Houppa_present"
                            value="Non"
                            onchange="showCount(event, false)"
                    >

                    Non

                </label>

            </div>


            <div
                    class="guest-count-box"
                    id="Houppa_count_box"
            >

                <label for="Houppa_nombre">
                    Nombre de personnes
                </label>

                <input
                        type="number"
                        id="Houppa_nombre"
                        name="Houppa_nombre"
                        min="1"
                        max="20"
                        value="1"
                >

            </div>


            <!-- =================================
                 ENVOYER
            ================================== -->

            <button
                    type="submit"
                    class="btn-submit"
                    id="submitBtn"
            >
                Confirmer ma venue
            </button>

        </form>


        <!-- =====================================
             RETOUR
        ====================================== -->

        <a
                href="menu.html"
                class="back-btn"
        >
            ← Retour
        </a>

    </section>

</main>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

    /* =========================================
       AFFICHER / MASQUER NOMBRE DE PERSONNES
    ========================================= */

    function showCount(event, isPresent) {

        const name = event.target.name;

        let boxId = "";

        if (name === "Mairie_present") {

            boxId = "Mairie_count_box";

        } else if (name === "Houppa_present") {

            boxId = "Houppa_count_box";

        }

        const box = document.getElementById(boxId);

        if (!box) {
            return;
        }

        if (isPresent) {

            box.style.display = "block";

        } else {

            box.style.display = "none";

        }
    }


    /* =========================================
       ENVOI GOOGLE APPS SCRIPT
    ========================================= */

    const form = document.getElementById("rsvpForm");

    const submitBtn = document.getElementById("submitBtn");

    const scriptURL =
        "https://script.google.com/macros/s/AKfycbxRJvIxCqOPLGQ3IKx7YEEGptfV872PrGsRdNbqHJqQUHWMJnn4sEFjoks-qmXlCGNLPw/exec";


    form.addEventListener("submit", function(event) {

        event.preventDefault();


        /* Désactivation du bouton */

        submitBtn.disabled = true;

        submitBtn.textContent = "Envoi en cours...";


        /* Récupération des données */

        const formData = new FormData(form);


        /* Envoi */

        fetch(scriptURL, {

            method: "POST",

            body: formData

        })

            .then(function(response) {

                if (!response.ok) {
                    throw new Error("Erreur serveur");
                }

                return response.text();

            })

            .then(function() {

                /* Message de succès */

                submitBtn.textContent = "Merci !";


                /* Reset formulaire */

                form.reset();


                /* Cacher les compteurs */

                document.getElementById(
                    "Mairie_count_box"
                ).style.display = "none";


                document.getElementById(
                    "Houppa_count_box"
                ).style.display = "none";


                /*
                    Redirection après confirmation
                */

                setTimeout(function() {

                    window.location.href =
                        "premiere-page.html";

                }, 2000);

            })

            .catch(function(error) {

                console.error(error);

                alert(
                    "Une erreur est survenue. Merci de réessayer."
                );


                submitBtn.disabled = false;

                submitBtn.textContent =
                    "Confirmer ma venue";

            });

    });

</script>

</body>
</html>
