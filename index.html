<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sephora & Jonathan</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: url('fond1.png') center center / cover no-repeat;
            background-color: #ead8cc;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 248, 242, 0.12);
            pointer-events: none;
        }

        .invitation-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 55px 25px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            box-shadow: 0 10px 35px rgba(124, 69, 61, 0.12);
            animation: appear 1.2s ease both;
        }

        /* NOTRE MARIAGE : plus visible */
        .top-label {
            margin-bottom: 28px;
            color: #965747;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        /* Prénoms dans la même écriture que le titre Mairie */
        .names {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #a96556;
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            font-size: clamp(3.8rem, 12vw, 5.8rem);
            line-height: 1.05;
            text-shadow: 0 1px 1px rgba(124, 69, 61, 0.08);
        }

        .name {
            display: block;
            max-width: 100%;
        }

        .ampersand {
            display: block;
            margin: 2px 0 0;
            color: #b87a68;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 9vw, 4.2rem);
            font-weight: 400;
            line-height: 0.9;
        }

        /* Date : plus épaisse et plus lisible */
        .date {
            margin-top: 35px;
            color: #965747;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            line-height: 1.8;
            text-transform: uppercase;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 30px auto;
            color: #b87a68;
            font-size: 12px;
        }

        .decoration::before,
        .decoration::after {
            content: "";
            width: 55px;
            height: 1px;
            background: rgba(169, 101, 86, 0.55);
        }

        .enter-button {
            display: inline-block;
            padding: 14px 30px;
            border: 1px solid #a96556;
            background: #a96556;
            color: #fffaf6;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .enter-button:hover {
            background: transparent;
            color: #965747;
        }

        .bottom-text {
            margin-top: 24px;
            color: #a96556;
            font-family: 'Great Vibes', cursive;
            font-size: 25px;
            font-weight: 400;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .invitation-card {
                padding: 42px 18px 35px;
            }

            .top-label {
                margin-bottom: 25px;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 3px;
            }

            .names {
                font-size: clamp(3.5rem, 15vw, 4.8rem);
            }

            .date {
                margin-top: 28px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 2px;
            }

            .decoration {
                margin: 25px auto;
            }

            .enter-button {
                padding: 13px 22px;
                font-size: 9px;
            }
        }

        @media (max-height: 650px) {
            .invitation-card {
                padding-top: 30px;
                padding-bottom: 25px;
            }

            .top-label {
                margin-bottom: 18px;
            }

            .names {
                font-size: clamp(3rem, 10vh, 4.5rem);
            }

            .date {
                margin-top: 22px;
            }

            .decoration {
                margin: 18px auto;
            }

            .bottom-text {
                margin-top: 15px;
            }
        }
    </style>
    <link rel="preload" as="image" href="fond1.png">
    <script src="site.js" defer></script>
</head>

<body>
<main class="invitation-card">
    <p class="top-label">Notre mariage</p>

    <h1 class="names">
        <span class="name">Sephora</span>
        <span class="ampersand">&amp;</span>
        <span class="name">Jonathan</span>
    </h1>

    <p class="date">7 &amp; 8 décembre 2026</p>

    <div class="decoration" aria-hidden="true">✦</div>

    <a class="enter-button" href="menu.html">
        Découvrir notre mariage
    </a>

</main>
</body>
</html>
