<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sephora & Jonathan</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100dvh;
            width: 100%;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* =========================
           IMAGE DE FOND
        ========================= */

        .bg-container {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: url('fond1.png') no-repeat center center;
            background-size: cover;

            z-index: 1;
        }

        /* =========================
           VOILE GLOBAL TRÈS LÉGER
        ========================= */

        .bg-overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.02);

            z-index: 2;
        }

        /* =========================
           INTERFACE PRINCIPALE
        ========================= */

        .main-ui {
            position: relative;

            z-index: 10;

            height: 100dvh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        /* =========================
           ZONE DES PRÉNOMS
        ========================= */

        .names-container {
            position: relative;

            padding: 35px 45px;

            animation: fadeIn 2.5s ease-in-out;

            /* Plus de carré blanc */
            background: transparent;

            backdrop-filter: none;
            -webkit-backdrop-filter: none;

            box-shadow: none;
        }

        /* =========================
           PRÉNOMS
        ========================= */

        .names {
            font-family: 'Montserrat', sans-serif;

            font-size: clamp(2rem, 11vw, 3.8rem);

            color: #C66A4A;

            font-weight: 500;

            text-transform: uppercase;

            letter-spacing: 10px;

            line-height: 1.4;

            text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.95),
                    0 0 20px rgba(255, 255, 255, 0.7),
                    0 0 35px rgba(255, 255, 255, 0.45);
        }

        /* =========================
           AMPERSAND
        ========================= */

        .ampersand {
            display: block;

            font-family: 'Great Vibes', cursive;

            font-size: 3.2rem;

            color: #C66A4A;

            text-transform: none;

            letter-spacing: 0;

            margin: -5px 0;

            font-weight: 400;
        }

        /* =========================
           SOUS-TITRE
        ========================= */

        .subtitle {
            font-family: 'Montserrat', sans-serif;

            color: #C66A4A;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 8px;

            margin-top: 25px;

            font-weight: 700;
        }

        /* =========================
           BOUTON DÉCOUVRIR
        ========================= */

        .cta-container {
            position: absolute;

            bottom: 12dvh;
        }

        .cta-center {
            display: inline-block;

            text-decoration: none;

            color: #fff;

            padding: 15px 50px;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 5px;

            background: #C66A4A;

            transition: 0.4s;

            font-weight: 600;

            box-shadow:
                    0 4px 15px rgba(198, 106, 74, 0.45);

            border: none;

            cursor: pointer;
        }

        .cta-center:hover {
            background: #B85D40;

            transform: translateY(-2px);

            box-shadow:
                    0 7px 20px rgba(198, 106, 74, 0.5);
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           BOUTON SON
        ========================= */

        #mute-btn {
            position: fixed;

            bottom: 20px;
            right: 20px;

            z-index: 100;

            color: #C66A4A;

            font-size: 9px;

            letter-spacing: 2px;

            cursor: pointer;

            display: none;

            font-weight: 700;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .names-container {
                padding: 28px 25px;
            }

            .names {
                letter-spacing: 7px;
            }

            .ampersand {
                font-size: 2.8rem;
            }

            .cta-center {
                padding: 14px 38px;
            }
        }

    </style>
</head>

<body>

<!-- IMAGE DE FOND -->
<div class="bg-container"></div>

<!-- VOILE GLOBAL TRÈS LÉGER -->
<div class="bg-overlay"></div>


<!-- MUSIQUE -->
<audio id="bg-music" loop>
    <source src="musique4.mp3" type="audio/mpeg">
</audio>


<!-- BOUTON SON -->
<div id="mute-btn" onclick="toggleMute()">
    SOUND ON
</div>


<!-- CONTENU -->
<div class="main-ui">

    <div class="names-container">

        <h1 class="names">

            SEPHORA

            <span class="ampersand">
                &
            </span>

            JONATHAN

        </h1>

        <p class="subtitle"></p>

    </div>


    <!-- BOUTON DÉCOUVRIR -->
    <div class="cta-container">

        <a
                href="menu.html"
                target="_blank"
                class="cta-center"
                onclick="playMusic()"
        >
            Découvrir
        </a>

    </div>

</div>


<script>

    const audio = document.getElementById('bg-music');

    const muteBtn = document.getElementById('mute-btn');


    function playMusic() {

        audio.play();

        muteBtn.style.display = 'block';

    }


    function toggleMute() {

        if (audio.paused) {

            audio.play();

            muteBtn.innerText = "SOUND ON";

        } else {

            audio.pause();

            muteBtn.innerText = "SOUND OFF";

        }

    }

</script>

</body>
</html>
