<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sephora & Jonathan</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            background: #000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* =========================
           FOND
        ========================= */

        .bg-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            background: url('fond1.png') no-repeat center center;
            background-size: cover;

            z-index: 1;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.02);

            z-index: 2;
        }

        /* =========================
           CONTENU
        ========================= */

        .main-ui {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 22px;

            text-align: center;
        }

        /* =========================
           PETIT TEXTE
        ========================= */

        .top-label {
            font-family: 'Montserrat', sans-serif;

            font-size: 8px;
            letter-spacing: 5px;

            text-transform: uppercase;

            color: #C66A4A;

            font-weight: 700;

            margin-bottom: 18px;

            opacity: 0.9;
        }

        /* =========================
           NOMS
        ========================= */

        .names {
            font-family: 'Montserrat', sans-serif;

            font-size: clamp(2.3rem, 10vw, 4.5rem);

            font-weight: 700;

            letter-spacing: 7px;

            color: #C66A4A;

            line-height: 1.15;

            text-transform: uppercase;

            text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.95),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 45px rgba(255, 255, 255, 0.5);
        }

        /* =========================
           AMPERSAND
        ========================= */

        .ampersand {
            display: block;

            font-family: 'Great Vibes', cursive;

            font-size: clamp(4rem, 17vw, 7rem);

            font-weight: 400;

            color: #C66A4A;

            line-height: 0.75;

            margin: 8px 0 12px;

            text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.95),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 45px rgba(255, 255, 255, 0.5);
        }

        /* =========================
           DATE
        ========================= */

        .date {
            font-family: 'Montserrat', sans-serif;

            font-size: clamp(0.9rem, 3.5vw, 1.15rem);

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #C66A4A;

            font-weight: 400;

            margin-top: 18px;

            line-height: 1.3;

            background: rgba(255, 255, 255, 0.38);

            padding: 7px 16px;

            border-radius: 6px;

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);

            text-shadow:
                    0 1px 2px rgba(120, 55, 35, 0.25),
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 16px rgba(255, 255, 255, 1),
                    0 0 28px rgba(255, 255, 255, 0.95),
                    0 0 45px rgba(255, 255, 255, 0.75);

            box-shadow:
                    0 0 15px rgba(255, 255, 255, 0.25);
        }

        /* =========================
           DÉCORATION
        ========================= */

        .decoration {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin: 22px 0 30px;
        }

        .decoration::before,
        .decoration::after {
            content: "";

            width: 45px;

            height: 1px;

            background: #C66A4A;

            opacity: 0.5;
        }

        .decoration span {
            color: #C66A4A;

            font-size: 12px;

            opacity: 0.8;

            text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* =========================
           BOUTON
        ========================= */

        .enter-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 180px;

            padding: 15px 38px;

            color: #fff;

            text-decoration: none;

            background: #C66A4A;

            border: none;

            font-family: 'Montserrat', sans-serif;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 4px;

            font-weight: 600;

            box-shadow:
                    0 5px 18px rgba(198, 106, 74, 0.3);

            transition:
                    transform 0.3s ease,
                    background 0.3s ease,
                    box-shadow 0.3s ease;
        }

        .enter-button:hover {
            transform: translateY(-3px);

            background: #B85D40;

            box-shadow:
                    0 8px 25px rgba(198, 106, 74, 0.4);
        }

        .enter-button:active {
            transform: translateY(-1px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .main-ui {
                padding: 25px 18px;
            }

            .top-label {
                font-size: 10px;

                letter-spacing: 4px;

                margin-bottom: 15px;
            }

            .names {
                font-size: 2.4rem;

                letter-spacing: 5px;
            }

            .ampersand {
                font-size: 4.5rem;

                margin: 5px 0 10px;
            }

            .date {
                font-size: 0.9rem;

                letter-spacing: 3px;

                /* Gras uniquement sur mobile */
                font-weight: 700;

                padding: 6px 12px;

                background: rgba(255, 255, 255, 0.38);

                text-shadow:
                        0 1px 2px rgba(120, 55, 35, 0.25),
                        0 0 7px rgba(255, 255, 255, 1),
                        0 0 15px rgba(255, 255, 255, 1),
                        0 0 25px rgba(255, 255, 255, 0.9),
                        0 0 38px rgba(255, 255, 255, 0.7);
            }

            .decoration {
                margin: 18px 0 25px;
            }

            .decoration::before,
            .decoration::after {
                width: 35px;
            }

            .enter-button {
                min-width: 160px;

                padding: 13px 30px;

                font-size: 8px;

                letter-spacing: 3px;
            }
        }

        /* =========================
           PETITS ÉCRANS
        ========================= */

        @media (max-height: 700px) {

            .names {
                font-size: 2.2rem;
            }

            .ampersand {
                font-size: 4rem;
            }

            .date {
                margin-top: 8px;
            }

            .decoration {
                margin: 15px 0 20px;
            }

            .enter-button {
                padding: 12px 30px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     FOND
========================= -->

<div class="bg-container"></div>

<!-- Voile léger -->
<div class="bg-overlay"></div>

<!-- =========================
     CONTENU PRINCIPAL
========================= -->

<main class="main-ui">

    <div class="top-label">
        Notre mariage
    </div>

    <div class="names">
        SEPHORA
    </div>

    <br>

    <div class="ampersand">
        &
    </div>

    <div class="names">
        JONATHAN
    </div>

    <div class="date">
        7 &amp; 8 DÉCEMBRE 2026
    </div>

    <div class="decoration">
        <span>✦</span>
    </div>

    <a
            href="menu.html"
            class="enter-button"
            target="_blank"
    >
        Découvrir notre mariage
    </a>

</main>

</body>
</html>
