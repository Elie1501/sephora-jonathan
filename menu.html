```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sephora & Jonathan</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            background: #000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* =========================================
           IMAGE DE FOND
        ========================================= */

        .bg-container {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: url('fond1.png') no-repeat center center;
            background-size: cover;

            z-index: 1;
        }


        /* =========================================
           VOILE TRÈS LÉGER
        ========================================= */

        .bg-overlay {
            position: fixed;
            inset: 0;

            background: rgba(255, 255, 255, 0.02);

            z-index: 2;
        }


        /* =========================================
           CONTENU
        ========================================= */

        .main-ui {
            position: relative;

            z-index: 10;

            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px 22px;

            text-align: center;
        }


        /* =========================================
           PETIT TEXTE DU HAUT
        ========================================= */

        .top-label {
            font-family: 'Montserrat', sans-serif;

            font-size: 8px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: #3b1e2f;

            font-weight: 600;

            margin-bottom: 10px;

            opacity: 0.8;
        }


        /* =========================================
           TITRE
        ========================================= */

        .main-title {
            font-family: 'Great Vibes', cursive;

            font-size: clamp(3.4rem, 15vw, 5.5rem);

            color: #3b1e2f;

            font-weight: 400;

            line-height: 1;

            margin-bottom: 12px;

            text-shadow:
                    0 0 10px rgba(255,255,255,0.95),
                    0 0 25px rgba(255,255,255,0.75);
        }


        /* =========================================
           PETITE LIGNE DÉCORATIVE
        ========================================= */

        .title-decoration {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-bottom: 35px;
        }

        .title-decoration::before,
        .title-decoration::after {
            content: "";

            width: 35px;
            height: 1px;

            background: #3b1e2f;

            opacity: 0.45;
        }

        .title-decoration span {
            color: #3b1e2f;

            font-size: 12px;

            opacity: 0.7;
        }


        /* =========================================
           MENU
        ========================================= */

        .nav-list {
            width: min(420px, 100%);

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-bottom: 35px;
        }


        /* =========================================
           LIENS
        ========================================= */

        .nav-link {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 70px;

            width: 100%;

            text-decoration: none;

            background: rgba(255, 255, 255, 0.35);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            border: 1px solid rgba(255,255,255,0.45);

            box-shadow:
                    0 5px 20px rgba(59, 30, 47, 0.08);

            transition:
                    transform 0.3s ease,
                    background 0.3s ease,
                    box-shadow 0.3s ease;

            overflow: hidden;
        }


        /* petit reflet */

        .nav-link::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background: #3b1e2f;

            opacity: 0.45;
        }


        .nav-link:hover {
            transform: translateY(-3px);

            background: rgba(255,255,255,0.55);

            box-shadow:
                    0 8px 25px rgba(59, 30, 47, 0.15);
        }


        /* =========================================
           TEXTE DES RUBRIQUES
        ========================================= */

        .nav-item {
            font-family: 'Great Vibes', cursive;

            font-size: 2.8rem;

            color: #3b1e2f;

            font-weight: 400;

            line-height: 1;

            text-shadow:
                    0 0 10px rgba(255,255,255,0.9);

            transition: 0.3s;
        }


        .nav-link:hover .nav-item {
            transform: scale(1.03);
        }


        /* =========================================
           PETIT SOUS-TEXTE
        ========================================= */

        .nav-description {
            position: absolute;

            right: 18px;

            font-family: 'Montserrat', sans-serif;

            font-size: 7px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #3b1e2f;

            opacity: 0.55;
        }


        /* =========================================
           BOUTON RETOUR
        ========================================= */

        .back-home {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 150px;

            padding: 13px 35px;

            color: #fff;

            text-decoration: none;

            background: #3b1e2f;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 4px;

            font-weight: 600;

            box-shadow:
                    0 5px 18px rgba(59, 30, 47, 0.3);

            transition: 0.3s;
        }


        .back-home:hover {
            transform: translateY(-2px);

            background: #52283f;
        }


        /* =========================================
           VERSION MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .main-ui {
                padding: 25px 18px;
            }

            .top-label {
                font-size: 7px;
                letter-spacing: 4px;
            }

            .main-title {
                font-size: 4rem;

                margin-bottom: 8px;
            }

            .title-decoration {
                margin-bottom: 28px;
            }

            .nav-list {
                gap: 10px;

                margin-bottom: 25px;
            }

            .nav-link {
                min-height: 64px;
            }

            .nav-item {
                font-size: 2.5rem;
            }

            .nav-description {
                display: none;
            }

            .back-home {
                min-width: 135px;

                padding: 12px 30px;
            }
        }


        /* =========================================
           PETITS ÉCRANS
        ========================================= */

        @media (max-height: 700px) {

            .main-title {
                font-size: 3.5rem;
            }

            .title-decoration {
                margin-bottom: 20px;
            }

            .nav-link {
                min-height: 56px;
            }

            .nav-item {
                font-size: 2.3rem;
            }

            .nav-list {
                gap: 8px;

                margin-bottom: 18px;
            }
        }

    </style>
</head>

<body>

<!-- =========================================
     FOND
========================================= -->

<div class="bg-container"></div>

<div class="bg-overlay"></div>


<!-- =========================================
     MENU
========================================= -->

<main class="main-ui">

    <div class="top-label">
        Sephora & Jonathan
    </div>


    <h1 class="main-title">
        Notre mariage
    </h1>



    </div>


    <nav class="nav-list">

        <!-- MAIRIE -->

        <a href="mairie.html" class="nav-link">

                <span class="nav-item">
                    Mairie
                </span>



        </a>


        <!-- HOUPPA -->

        <a href="soiree.html" class="nav-link">

                <span class="nav-item">
                    Houppa et soirée orientale
                </span>




        </a>


        <!-- RÉPONSE -->

        <a href="formulaire.html" class="nav-link">

                <span class="nav-item">
                    Réponse
                </span>



        </a>

    </nav>


    <!-- RETOUR -->

    <a href="index.html" class="back-home">
        Retour
    </a>

</main>

</body>
</html>
