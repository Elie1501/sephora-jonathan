<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sephora & Jonathan</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700;800&family=Cinzel:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* FOND */
        .bg-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: url('fond1.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* VOILE LÉGER */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.02);
            z-index: 2;
        }

        /* CONTENU */
        .main-ui {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* CARTE BLANCHE — STYLE DE LA PAGE MAIRIE */
        .content-card {
            width: min(460px, 100%);
            padding: 34px 30px 30px;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 10px 35px rgba(198, 106, 74, 0.10);

            animation: fadeIn 1.2s ease-out;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NOMS */
        .top-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #C66A4A;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.6;

            text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 15px rgba(255, 255, 255, 0.85);
        }

        /* TITRE */
        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.4rem, 15vw, 5.5rem);
            color: #C66A4A;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 10px;

            text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.95),
                    0 0 25px rgba(255, 255, 255, 0.8),
                    0 0 45px rgba(255, 255, 255, 0.5);
        }

        /* DÉCORATION */
        .title-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .title-decoration::before,
        .title-decoration::after {
            content: "";
            width: 42px;
            height: 1px;
            background: #C66A4A;
            opacity: 0.6;
        }

        .title-decoration span {
            color: #C66A4A;
            font-size: 13px;
            opacity: 0.9;

            text-shadow:
                    0 0 8px rgba(255, 255, 255, 1),
                    0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* MENU */
        .nav-list {
            width: min(420px, 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* BOUTONS DU MENU */
        .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 70px;
            width: 100%;
            padding: 10px 20px;

            text-decoration: none;

            /* Blanc translucide, assorti à la carte */
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 5px 20px rgba(198, 106, 74, 0.08);

            transition:
                    transform 0.3s ease,
                    background 0.3s ease,
                    box-shadow 0.3s ease;

            overflow: hidden;
        }

        /* ACCENT TERRACOTTA */
        .nav-link::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: #C66A4A;
            opacity: 0.65;
        }

        /* SURVOL */
        .nav-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 8px 25px rgba(198, 106, 74, 0.18);
        }

        /* TEXTE DES RUBRIQUES */
        .nav-item {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #C66A4A;
            font-weight: 400;
            line-height: 1.15;

            text-shadow:
                    0 0 10px rgba(255, 255, 255, 0.95),
                    0 0 20px rgba(255, 255, 255, 0.75);

            transition: transform 0.3s ease;
        }

        .nav-link:hover .nav-item {
            transform: scale(1.03);
        }

        /* BOUTON RETOUR */
        .back-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 150px;
            padding: 13px 35px;

            color: #fff;
            text-decoration: none;
            background: #C66A4A;

            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;

            box-shadow: 0 5px 18px rgba(198, 106, 74, 0.3);

            transition:
                    transform 0.3s ease,
                    background 0.3s ease,
                    box-shadow 0.3s ease;
        }

        .back-home:hover {
            transform: translateY(-2px);
            background: #B85D40;
            box-shadow: 0 8px 25px rgba(198, 106, 74, 0.4);
        }

        /* TABLETTES ET TÉLÉPHONES */
        @media (max-width: 600px) {
            .main-ui {
                min-height: 100dvh;
                padding: 14px 10px;
            }

            .content-card {
                width: 100%;
                max-width: 430px;
                padding: 28px 20px 25px;
                border-radius: 18px;

                background: rgba(255, 255, 255, 0.65);
                border: 1px solid rgba(255, 255, 255, 0.75);
            }

            .top-label {
                font-size: 9px;
                letter-spacing: 1.8px;
                margin-bottom: 12px;
            }

            .main-title {
                font-size: 4rem;
                margin-bottom: 7px;
            }

            .title-decoration {
                margin-bottom: 20px;
            }

            .nav-list {
                gap: 10px;
                margin-bottom: 20px;
            }

            .nav-link {
                min-height: 64px;
                padding: 8px 12px;
            }

            .nav-item {
                font-size: 2.5rem;
            }

            .back-home {
                min-width: 135px;
                padding: 12px 30px;
                font-size: 8px;
                letter-spacing: 3px;
            }
        }

        /* PETITS TÉLÉPHONES */
        @media (max-width: 380px) {
            .main-ui {
                padding: 10px 7px;
            }

            .content-card {
                padding: 23px 16px 21px;
            }

            .top-label {
                font-size: 8px;
                letter-spacing: 1.2px;
            }

            .main-title {
                font-size: 3.7rem;
            }

            .nav-item {
                font-size: 2.1rem;
            }

            .nav-link {
                min-height: 58px;
            }
        }

        /* ÉCRANS PEU HAUTS */
        @media (max-height: 700px) {
            .main-ui {
                justify-content: center;
            }

            .content-card {
                padding-top: 22px;
                padding-bottom: 22px;
            }

            .main-title {
                font-size: 3.5rem;
            }

            .title-decoration {
                margin-bottom: 16px;
            }

            .nav-link {
                min-height: 56px;
            }

            .nav-item {
                font-size: 2.3rem;
            }

            .nav-list {
                gap: 8px;
                margin-bottom: 16px;
            }

            .back-home {
                padding: 11px 28px;
            }
        }

        /* ACCESSIBILITÉ : RÉDUCTION DES ANIMATIONS */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link rel="preload" as="image" href="fond1.png">
    <script src="site.js" defer></script>
</head>

<body>

<!-- FOND -->
<div class="bg-container" aria-hidden="true"></div>
<div class="bg-overlay" aria-hidden="true"></div>

<!-- MENU -->
<main class="main-ui">
    <div class="content-card">

        <div class="top-label">
            Sephora & Jonathan
        </div>

        <h1 class="main-title">
            Notre mariage
        </h1>

        <div class="title-decoration" aria-hidden="true">
            <span>♡</span>
        </div>

        <nav class="nav-list" aria-label="Menu du mariage">

            <a href="mairie.html" class="nav-link">
                <span class="nav-item">Mairie</span>
            </a>

            <a href="soiree.html" class="nav-link">
                <span class="nav-item">Houppa et soirée orientale</span>
            </a>

            <a href="formulaire.html" class="nav-link">
                <span class="nav-item">Réponse</span>
            </a>

        </nav>

        <a href="index.html" class="back-home">
            Retour
        </a>

    </div>
</main>

</body>
</html>
